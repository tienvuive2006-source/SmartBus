# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=8080
server.servlet.context-path=/api

# ===================================================================
# DATASOURCE CONFIGURATION (H2 In-Memory Database - CHẠY NGAY KHÔNG CẦN CÀI ĐẶT)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:smartbusdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ===================================================================
# DATASOURCE CONFIGURATION (Microsoft SQL Server - TẠM THỜI COMMENT LẠI)
# ===================================================================
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=smart_bus_booking;encrypt=true;trustServerCertificate=true;
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.datasource.username=sa
# spring.datasource.password=your_strong_password_here

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Cho phép truy cập API từ Frontend Vue 3 chạy ở port 5174 (CORS Setup)
# Sẽ được cấu hình chi tiết thêm trong mã nguồn java WebConfig.
