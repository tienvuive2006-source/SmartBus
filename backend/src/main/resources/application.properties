# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=8080
server.servlet.context-path=/api

# ===================================================================
# DATASOURCE CONFIGURATION (Microsoft SQL Server)
# ===================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=smart_bus_booking;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=tien2
spring.datasource.password=123456

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# 🇻🇳 BÙA CHÚ ĐẶC TRỊ TIẾNG VIỆT CHO SQL SERVER:
# Ép mọi cột String thành NVARCHAR thay vì VARCHAR
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# ===================================================================
# JWT CONFIGURATION
# ===================================================================
# Secret key: Chuoi bi mat de ky token (phai dai hon 256-bit = 32 ky tu)
jwt.secret=SmartBusJwtSuperSecretKey2026@SkyBus!VietNam#Secure
# Token het han sau 7 ngay (7 * 24 * 60 * 60 * 1000 ms)
jwt.expiration-ms=604800000

# ===================================================================
# EMAIL CONFIGURATION (SMTP)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tienvuive2006@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

