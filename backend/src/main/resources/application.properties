# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=8080
server.servlet.context-path=/api

# ===================================================================
# DATASOURCE CONFIGURATION (Microsoft SQL Server)
# ===================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=smart_bus_booking;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=tien2
spring.datasource.password=123456

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# 🇻🇳 BÙA CHÚ ĐẶC TRỊ TIẾNG VIỆT CHO SQL SERVER:
# Ép mọi cột String thành NVARCHAR thay vì VARCHAR
spring.jpa.properties.hibernate.use_nationalized_character_data=true
